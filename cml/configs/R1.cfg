! ==========================================
! Cisco IOSv Configuration: Router R1 (Source Gateway)
! ==========================================
hostname R1
!
ip routing
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface Loopback0
 description Source LAN Network
 ip address 192.168.1.1 255.255.255.0
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description Transit to SW1
 ip address 10.0.12.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface Loopback0
!
line vty 0 4
 transport input ssh
 login local
!
end

! ==========================================
! Cisco IOSvL2 Configuration: Switch SW3 (Redundant Backup Transit)
! ==========================================
hostname SW3
!
ip routing
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/2
 description Backup Link to SW1
 no switchport
 ip address 10.0.13.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description Backup Link to SW2
 no switchport
 ip address 10.0.32.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 33.33.33.33
 log-adjacency-changes
!
line vty 0 4
 transport input ssh
 login local
!
end

! ==========================================
! Cisco IOSvL2 Configuration: Switch SW1 (Distribution Ingress)
! ==========================================
hostname SW1
!
ip routing
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description Transit to R1
 no switchport
 ip address 10.0.12.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description Primary Link to SW2 (AI Monitored)
 no switchport
 ip address 10.0.23.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/2
 description Backup Link to SW3
 no switchport
 ip address 10.0.13.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 11.11.11.11
 log-adjacency-changes
!
line vty 0 4
 transport input ssh
 login local
!
end

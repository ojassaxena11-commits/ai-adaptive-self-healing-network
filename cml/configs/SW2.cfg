! ==========================================
! Cisco IOSvL2 Configuration: Switch SW2 (Distribution Egress)
! ==========================================
hostname SW2
!
ip routing
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/1
 description Primary Link from SW1
 no switchport
 ip address 10.0.23.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/2
 description Backup Link from SW3
 no switchport
 ip address 10.0.32.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/0
 description Transit to R2
 no switchport
 ip address 10.0.24.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 22.22.22.22
 log-adjacency-changes
!
line vty 0 4
 transport input ssh
 login local
!
end

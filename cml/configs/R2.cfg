! ==========================================
! Cisco IOSv Configuration: Router R2 (Destination Gateway)
! ==========================================
hostname R2
!
ip routing
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface Loopback0
 description Destination LAN Network
 ip address 192.168.2.1 255.255.255.0
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description Transit to SW2
 ip address 10.0.24.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 passive-interface Loopback0
!
line vty 0 4
 transport input ssh
 login local
!
end

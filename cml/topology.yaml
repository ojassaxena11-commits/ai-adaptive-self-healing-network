lab:
  title: "AI-Driven Adaptive Self-Healing Network"
  description: "Redundant Cisco network topology featuring R1, SW1, SW2, SW3, R2 for ML-based proactive link failure prediction and OSPF self-healing."
  notes: "Primary Path: R1 -> SW1 -> SW2 -> R2 (Cost 30). Backup Path: R1 -> SW1 -> SW3 -> SW2 -> R2 (Cost 40)."
  version: "0.1.0"

nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: -300
    y: 0
    configuration: "R1.cfg"
  - id: n1
    label: SW1
    node_definition: iosvl2
    x: -100
    y: 0
    configuration: "SW1.cfg"
  - id: n2
    label: SW2
    node_definition: iosvl2
    x: 100
    y: 0
    configuration: "SW2.cfg"
  - id: n3
    label: SW3
    node_definition: iosvl2
    x: 0
    y: 150
    configuration: "SW3.cfg"
  - id: n4
    label: R2
    node_definition: iosv
    x: 300
    y: 0
    configuration: "R2.cfg"

links:
  # R1 to SW1
  - id: l0
    n1: n0
    i1: GigabitEthernet0/0
    n2: n1
    i2: GigabitEthernet0/0
    label: "R1_SW1_Transit"

  # SW1 to SW2 (Primary Link)
  - id: l1
    n1: n1
    i1: GigabitEthernet0/1
    n2: n2
    i2: GigabitEthernet0/1
    label: "Primary_SW1_SW2"

  # SW1 to SW3 (Backup Ingress)
  - id: l2
    n1: n1
    i1: GigabitEthernet0/2
    n2: n3
    i2: GigabitEthernet0/2
    label: "Backup_SW1_SW3"

  # SW3 to SW2 (Backup Egress)
  - id: l3
    n1: n3
    i1: GigabitEthernet0/1
    n2: n2
    i2: GigabitEthernet0/2
    label: "Backup_SW3_SW2"

  # SW2 to R2
  - id: l4
    n1: n2
    i1: GigabitEthernet0/0
    n2: n4
    i2: GigabitEthernet0/0
    label: "SW2_R2_Transit"
